<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course review</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #fff; --surface-2: #f7f8fa; --ink: #1c2230; --muted: #5f6878; --line: #e3e6eb; --line-2: #d3d7de;
  --c-expl: #2d6cdf; --c-we: #0e8a80; --c-item: #b45f00; --c-key: #3d8a12; --c-find: #7c3aed; --c-err: #c62828;
  --key-bg: #f2f8ec; --hl: #ffe680; --hl-edge: #d9b000; --sg-bg: #efe6ff; --pending: #bdd4ff; --annotated: #f28e2b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111419; --surface: #191d24; --surface-2: #20252d; --ink: #e4e7ed; --muted: #9aa3b1; --line: #2a303a; --line-2: #3a414d;
  --c-expl: #72a3ff; --c-we: #3cc2b4; --c-item: #f0a040; --c-key: #8dcf50; --c-find: #b28dff; --c-err: #ff6b6b;
  --key-bg: #1b2517; --hl: rgba(255, 214, 0, .3); --hl-edge: #d9b400; --sg-bg: rgba(178, 141, 255, .2); --pending: rgba(114, 163, 255, .35);
  --annotated: #f5a04a; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --surface: #191d24; --surface-2: #20252d; --ink: #e4e7ed; --muted: #9aa3b1; --line: #2a303a; --line-2: #3a414d;
    --c-expl: #72a3ff; --c-we: #3cc2b4; --c-item: #f0a040; --c-key: #8dcf50; --c-find: #b28dff; --c-err: #ff6b6b;
    --key-bg: #1b2517; --hl: rgba(255, 214, 0, .3); --hl-edge: #d9b400; --sg-bg: rgba(178, 141, 255, .2); --pending: rgba(114, 163, 255, .35);
    --annotated: #f5a04a; color-scheme: dark;
  }
}
* { box-sizing: border-box }
html { scroll-padding-top: 90px }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif }
code { font-family: var(--mono); font-size: .86em }
code.block { display: block; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; margin: 6px 0 }
a { color: inherit }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 10px; cursor: pointer }
button:hover:not(:disabled) { border-color: var(--muted) }
button:disabled { opacity: .4; cursor: default }
button.primary { background: var(--c-find); border-color: var(--c-find); color: #fff }
:focus-visible { outline: 2px solid var(--c-expl); outline-offset: 2px }
.muted { color: var(--muted) }
[hidden] { display: none !important }

.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; height: 52px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line) }
.brand { flex: 1; display: flex; gap: 10px; align-items: baseline; min-width: 0 }
.brand strong { white-space: nowrap }
#course-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px }
.tabs { display: flex; gap: 4px }
.tabs a { text-decoration: none; padding: 5px 12px; border-radius: 7px; color: var(--muted); font-weight: 550; font-size: 14px }
.tabs a.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2) }
.top-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 13px }
#save.err { color: var(--c-err) }
#banner { position: sticky; top: 52px; z-index: 19; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 8px 16px; background: var(--sg-bg); border-bottom: 1px solid var(--line); font-size: 14px }

#view-content { display: grid; grid-template-columns: 220px minmax(0, 740px) 270px; gap: 26px; justify-content: center; padding: 24px 20px 50vh }
#list { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-size: 13px }
.list-head { padding: 0 8px 8px; color: var(--muted) }
.li { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px; text-decoration: none }
.li:hover { background: var(--surface) }
.li.cur { background: var(--surface); box-shadow: inset 3px 0 0 var(--c-expl) }
.li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted) }
.shape { width: 9px; height: 9px; flex: none; background: var(--muted); display: inline-block }
.s-kp { border-radius: 50% }
.s-topic { border-radius: 1px }
.s-trace { clip-path: polygon(50% 0, 100% 100%, 0 100%) }
.pill { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; flex: none }
.pill:empty { display: none }
.pill.a { background: var(--hl) }
.pill.s { background: var(--sg-bg); color: var(--c-find); font-weight: 600 }
.pill.new { background: var(--c-expl); color: #fff }

#record { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 32px 40px; min-width: 0 }
.rec-head .row { display: flex; align-items: flex-start; gap: 16px; font-size: 13px }
.rec-head .bits { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0 }
.rec-head .pos { display: flex; align-items: center; gap: 6px; white-space: nowrap }
.rec-head .rid { font-size: 13px; font-weight: 600 }
.kind { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.nav { padding: 0 9px; font-size: 16px; line-height: 24px }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0 }
.flags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px }
.flag { font-size: 12px; padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--muted) }
h1 { font-size: 23px; line-height: 1.3; margin: 14px 0 6px; font-weight: 650 }
.sub-line { margin: 2px 0 0; color: var(--muted); font-size: 14px }
.sub-line .lbl { margin-right: 8px }
.txt { white-space: pre-wrap; overflow-wrap: anywhere }
.lbl, .k { font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--role, var(--muted)) }
.k { margin-right: 8px; color: var(--muted) }
.none { color: var(--muted); font-style: italic; margin: 0 }

.sec { margin-top: 36px; --role: var(--muted) }
.sec > .lbl { display: block; margin-bottom: 8px }
.sec.expl { --role: var(--c-expl) }
.sec.we { --role: var(--c-we) }
.sec.items { --role: var(--c-item) }
.sec.expl .sbody, .sec.we .sbody { border-left: 3px solid var(--role); padding: 2px 0 2px 16px }
.sec ul { margin: 0; padding-left: 20px }
.steps { margin: 12px 0 0; padding-left: 22px }
.steps li { margin: 8px 0 }
.steps .sub { font-weight: 600 }
.steps li::marker { color: var(--c-we); font-weight: 600 }
.we .ans, .we .diagram { margin-top: 12px }
.diagram .txt { font-style: italic; color: var(--muted) }

.item { margin-top: 16px; border-left: 3px solid var(--c-item); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 10px 16px 14px }
.item-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; --role: var(--c-item) }
.item-head .path { color: var(--muted); font-size: 12px }
.tag { font-size: 11px; padding: 0 7px; border-radius: 8px; border: 1px solid var(--line-2); color: var(--muted) }
.disc { font-size: 12px; color: var(--muted) }
.choices { list-style: none; margin: 10px 0 0; padding: 0 }
.choices li { display: flex; gap: 10px; align-items: baseline; padding: 4px 8px; border-radius: 6px }
.choices .ltr { font-family: var(--mono); font-weight: 650; color: var(--muted); flex: none; width: 1.1em }
.choices li.right { box-shadow: inset 0 0 0 1.5px var(--c-key) }
.choices li.right .ltr, .keytag { color: var(--c-key) }
.keytag { margin-left: auto; font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase }
.keysol { margin-top: 12px; padding: 8px 12px; border-left: 3px solid var(--c-key); background: var(--key-bg); border-radius: 0 6px 6px 0; --role: var(--c-key) }
.keyline { display: flex; gap: 10px; align-items: baseline }
.key { font-weight: 700; font-size: 14px }
.bad { color: var(--c-err); font-size: 12px }
.sol { margin-top: 4px; font-size: 14px }
.graph { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; margin: 0 }
.graph dt { color: var(--muted); font-size: 13px; padding-top: 2px }
.graph dd { margin: 0 }
.ref { display: inline-flex; gap: 6px; align-items: baseline; margin: 0 6px 4px 0; padding: 1px 9px; border: 1px solid var(--line-2); border-radius: 12px; font-size: 13px; text-decoration: none; max-width: 100% }
a.ref:hover { border-color: var(--c-expl) }
.ctx { margin-top: 40px; opacity: .65; font-size: 13px }
.ctx[open] { opacity: 1 }
.ctx summary { cursor: pointer; color: var(--muted) }
.ctx > div { margin-top: 12px }

.step { margin-top: 22px; padding: 8px 12px 12px; border: 1px solid var(--line); border-radius: 10px }
.step.sub { margin-left: 28px; border-style: dashed }
.step-head { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted) }
.msg { margin-top: 6px; padding: 4px 10px; border-left: 3px solid var(--role); --role: var(--muted) }
.msg.asst { --role: var(--c-expl) }
.msg.think { --role: var(--c-expl); font-style: italic; background: var(--surface-2) }
.msg.final { background: var(--surface-2) }
.msg.call { --role: var(--c-item) }
.msg.result { --role: var(--c-we) }
.msg.err { --role: var(--c-err) }
.msg.boiler { opacity: .55 }
.msg.boiler[open] { opacity: 1 }
.msg summary { cursor: pointer; font-size: 13px; color: var(--muted) }
.call-head { display: flex; gap: 10px; align-items: baseline }
.tool { font-weight: 700; font-size: 14px }
.kv { font-size: 13px }
.out { max-height: 420px; overflow: auto }

mark { color: inherit; background: none }
mark.hl { background: var(--hl); border-radius: 2px; box-shadow: 0 1.5px 0 var(--hl-edge) }
mark.sg { background: var(--sg-bg); border-bottom: 1.5px dashed var(--c-find) }
mark.pending { background: var(--pending) }
mark.linked { outline: 2px solid var(--ink); outline-offset: 1px }
mark.flash { animation: flash 1.4s }
@keyframes flash { 0%, 50% { outline: 3px solid var(--c-expl); outline-offset: 2px } }

#margin { position: relative; min-width: 0 }
.note { position: absolute; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--hl-edge); border-radius: 0 8px 8px 0; padding: 7px 10px 8px; font-size: 13px; line-height: 1.45; cursor: pointer; transition: top .12s }
.note.sug { border-left: 3px dashed var(--c-find) }
.note .tag { color: var(--muted) }
.note.sug .tag { color: var(--c-find); border-color: var(--c-find) }
.note .mode { font-weight: 650; margin-top: 4px }
.note .q { color: var(--muted); font-style: italic; margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.note .txt { margin-top: 3px }
.note .lost { color: var(--c-err); font-size: 12px; margin-top: 3px }
.note .acts { display: flex; gap: 6px; margin-top: 6px; opacity: 0 }
.note:hover .acts, .note:focus-within .acts, .note .acts.on { opacity: 1 }
.note.linked { box-shadow: 0 0 0 2px var(--ink) }
.note textarea, #popover textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 7px; resize: vertical }
#popover { position: absolute; z-index: 30; width: 320px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; box-shadow: 0 8px 28px rgb(0 0 0 / .2) }
#popover textarea { min-height: 64px; font-size: 14px }
#popover .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px }

.page { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin-bottom: 20px }
.card h2 { font-size: 16px; margin: 0 }
.card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px }
#map-plot svg { display: block; width: 100%; height: auto }
.pt { stroke: var(--surface); stroke-width: 1 }
.pt.smp { stroke: var(--ink); stroke-width: 2; cursor: pointer }
.pt:not(.smp) { opacity: .55 }
.panel { fill: var(--surface-2); stroke: var(--line) }
.ptitle { fill: var(--muted); font-size: 13px; font-weight: 600 }
.hulls { opacity: .16 }
.hulls path { stroke-width: 34px; stroke-linejoin: round; stroke-linecap: round }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 12px; align-items: center }
.legend svg { vertical-align: -2px; margin-right: 4px }
.clusters { list-style: none; padding: 0; margin: 12px 0 0; columns: 2; font-size: 13px; color: var(--muted) }
.clusters li { margin-bottom: 4px; break-inside: avoid }
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 20px rgb(0 0 0 / .15); max-width: 340px }
#treemap { position: relative; height: 440px }
.tm { position: absolute; overflow: auto; padding: 9px 11px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--c) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--surface)) }
.tm h3 { font-size: 14px; margin: 0 }
.tm h3 span { font-weight: 500; color: var(--muted) }
.tm p { margin: 3px 0 6px; color: var(--muted) }
.tm ul { margin: 0; padding-left: 16px }
.tm li { margin-bottom: 3px }
.empty { color: var(--muted); margin: 10px 0 }
.qbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 4px 0 12px; border-bottom: 1px solid var(--line); font-size: 13px }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 280px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.srow input { margin-top: 4px }
.srow .mode { font-weight: 650 }
.srow .src { font-size: 12px; color: var(--c-find); margin-left: 6px }
.srow .q { display: block; margin-top: 3px; font-style: italic; text-decoration-style: dashed; text-decoration-color: var(--c-find); overflow-wrap: anywhere }
.srow .note-t { color: var(--muted); font-size: 13px; margin-top: 2px }
.fatal { max-width: 640px; margin: 80px auto; padding: 0 20px }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Course review</strong><span id="course-title" class="muted"></span></div>
  <nav class="tabs" aria-label="Views">
    <a href="#content" data-view="content">Content</a>
    <a href="#map" data-view="map">Map</a>
    <a href="#progress" data-view="progress">Progress <span id="pending" class="pill s"></span></a>
  </nav>
  <div class="top-right"><span id="save" class="muted" role="status"></span><button id="theme" aria-label="Switch light or dark colours">◐</button></div>
</header>
<div id="banner" hidden></div>
<main>
  <section id="view-content" class="view">
    <aside id="list" aria-label="Records in the sample"></aside>
    <article id="record"></article>
    <aside id="margin" aria-label="Notes and suggestions"></aside>
  </section>
  <section id="view-map" class="view page" hidden>
    <div class="card"><h2>Map of all records</h2><p class="sub" id="map-sub"></p><div id="map-plot"></div><div id="map-legend"></div></div>
  </section>
  <section id="view-progress" class="view page" hidden>
    <div class="card"><h2>Failure modes</h2><p class="sub" id="modes-sub"></p><div id="treemap"></div></div>
    <div class="card"><h2>Agent suggestions to review</h2><p class="sub" id="queue-sub"></p>
      <div class="qbar"><label><input type="checkbox" id="pick-all"> Select all</label><button id="accept-sel" class="primary">Accept selected</button><button id="dismiss-sel">Dismiss selected</button></div>
      <div id="queue"></div>
    </div>
  </section>
</main>
<div id="popover" hidden role="dialog" aria-label="New note">
  <textarea aria-label="Note" placeholder="What is wrong here?"></textarea>
  <div class="row"><button id="pop-save" class="primary">Save</button><span class="muted">Enter saves · Shift+Enter new line · Esc cancels</span></div>
</div>
<div id="tip" hidden></div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const obj = x => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
const arr = x => (Array.isArray(x) ? x : []);
const short = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const countBy = (xs, k) => xs.reduce((m, x) => ((m[x[k]] = (m[x[k]] || 0) + 1), m), {});
const uid = () => 'a_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CLUSTER = ['#4e79a7', '#59a14f', '#e15759', '#76b7b2', '#9c755f', '#ff9da7', '#2f4b7c', '#bab0ac', '#8cd17d', '#d37295'];
const col = c => CLUSTER[(+c || 0) % CLUSTER.length];
const KIND = {kp: 'knowledge point', topic: 'topic', trace: 'build trace'};
const none = '<p class="none">none</p>';
const S = {meta: {}, records: new Map(), sample: [], annotations: [], suggestions: [], patterns: {}, graph: {},
  etag: {}, seen: new Set(), fresh: new Set(), decided: new Map(), news: {samples: [], sugg: 0},
  current: null, focus: null, pending: null, marksStale: false, dirty: false, saving: Promise.resolve(), linked: null};
const pendingSugg = () => S.suggestions.filter(s => (s.status || 'pending') === 'pending');

// Escape first, then add the three marks course text uses; nothing else becomes HTML.
function fmt(s) {
  return esc(s)
    .replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => `<code class="block">${code.replace(/\n$/, '')}</code>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*(?=\S)([^*\n]*[^\s*])\*\*/g, '<strong>$1</strong>'); // no * inside, so COUNT(*) never opens a bold run
}

// ---------- theme ----------
(() => {
  let saved = null;
  try { saved = localStorage.getItem('review-theme'); } catch {}
  const t = new URLSearchParams(location.search).get('theme') || saved;
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('review-theme', document.documentElement.dataset.theme); } catch {}
    if (!$('#view-map').hidden) renderMap();
  };
})();

// ---------- record rendering (data-f = the field path, e.g. practice.4.problem, used to anchor notes) ----------
const sec = (role, label, f, inner) => `<section class="sec ${role}" data-f="${f}"><span class="lbl">${label}</span><div class="sbody">${inner}</div></section>`;
function ref(id, extra = '') {
  const s = String(id ?? ''), r = S.records.get(s), x = extra ? ` ${esc(extra)}` : '';
  return r ? `<a class="ref" href="#content/${encodeURIComponent(s)}"><code>${esc(s)}</code>${esc(short(r.title, 56))}${x}</a>` : `<span class="ref"><code>${esc(s)}</code>${x}</span>`;
}
const refs = ids => arr(ids).map(x => ref(x)).join('') || none;

function item(q, f, label) {
  q = obj(q);
  const choices = arr(q.choices), key = String(q.answer ?? ''), letter = key.trim().replace(/[^A-Za-z]/g, '').toUpperCase();
  const ki = choices.length && letter.length === 1 ? letter.charCodeAt(0) - 65 : -1;
  const bad = choices.length > 0 && !(ki >= 0 && ki < choices.length);
  const disc = arr(q.discriminates);
  return `<div class="item" data-f="${f}"><div class="item-head"><span class="lbl">${label}</span><code class="path">${f.replace(/\./g, '/')}</code>` +
    (q.kind && q.kind !== 'answer' ? `<span class="tag">${esc(q.kind)}</span>` : '') +
    (disc.length ? `<span class="disc">discriminates ${disc.map(x => `<code>${esc(x)}</code>`).join(' ')}</span>` : '') + '</div>' +
    `<div class="txt" data-f="${f}.problem">${fmt(q.problem)}</div>` +
    (choices.length ? `<ol class="choices" data-f="${f}.choices">${choices.map((c, i) => `<li class="${i === ki ? 'right' : ''}" data-f="${f}.choices.${i}"><span class="ltr">${String.fromCharCode(65 + i)}</span><span class="txt">${fmt(c)}</span>${i === ki ? '<span class="keytag">key</span>' : ''}</li>`).join('')}</ol>` : '') +
    `<div class="keysol"><div class="keyline"><span class="lbl">Key</span><code class="key" data-f="${f}.answer">${esc(key)}</code>${bad ? '<span class="bad">no choice has this letter</span>' : ''}</div>` +
    `<div class="txt sol" data-f="${f}.solution">${fmt(q.solution)}</div>` +
    (q.check ? `<div data-f="${f}.check"><span class="lbl">Check</span><code class="block">${esc(typeof q.check === 'string' ? q.check : JSON.stringify(q.check, null, 2))}</code></div>` : '') +
    '</div></div>';
}

function context() {
  const m = S.meta, parts = [], fx = obj(m.fixtures);
  if (m.answer_format) parts.push(`<div><span class="k">Answer format</span><div class="txt">${fmt(m.answer_format)}</div></div>`);
  if (arr(m.entry_assumptions).length) parts.push(`<div><span class="k">Entry assumptions</span><ul>${arr(m.entry_assumptions).map(x => `<li class="txt">${fmt(x)}</li>`).join('')}</ul></div>`);
  if (Object.keys(fx).length) parts.push(`<div><span class="k">Fixtures</span>${Object.entries(fx).map(([k, v]) => `<div><code>${esc(k)}</code><code class="block">${esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2))}</code></div>`).join('')}</div>`);
  return parts.length ? `<details class="ctx"><summary>Course context: answer format, entry assumptions, fixtures (the same on every record)</summary>${parts.join('')}</details>` : '';
}

function kpBody(r) {
  const we = obj(r.worked_example), mis = arr(r.misconceptions), pr = arr(r.practice);
  return `<h1 data-f="label">${fmt(r.label || r.title)}</h1>` +
    (r.adds ? `<p class="sub-line" data-f="adds"><span class="lbl">Adds</span>${fmt(r.adds)}</p>` : '') +
    `<p class="sub-line" data-f="key_prerequisites"><span class="lbl">Key prerequisites</span>${arr(r.key_prerequisites).map(x => ref(x)).join('') || 'none'}</p>` +
    sec('expl', 'Explanation', 'explanation', `<div class="txt">${fmt(r.explanation)}</div>`) +
    sec('we', 'Worked example', 'worked_example',
      `<div class="txt" data-f="worked_example.problem">${fmt(we.problem)}</div>` +
      `<ol class="steps">${arr(we.steps).map((s, i) => `<li data-f="worked_example.steps.${i}"><span class="sub">${fmt(obj(s).subgoal)}</span><div class="txt">${fmt(obj(s).work)}</div></li>`).join('')}</ol>` +
      `<div class="ans" data-f="worked_example.answer"><span class="k">Answer</span><span class="txt">${fmt(we.answer)}</span></div>` +
      (we.diagram ? `<div class="diagram" data-f="worked_example.diagram"><span class="k">Diagram</span><div class="txt">${fmt(typeof we.diagram === 'string' ? we.diagram : JSON.stringify(we.diagram, null, 2))}</div></div>` : '')) +
    sec('plain', 'Misconceptions', 'misconceptions', mis.length ? `<ul>${mis.map((m, i) => `<li class="txt" data-f="misconceptions.${i}">${fmt(m)}</li>`).join('')}</ul>` : none) +
    sec('items', `Practice · ${pr.length}`, 'practice', pr.map((q, j) => item(q, 'practice.' + j, 'Practice item')).join('') || none) +
    context();
}

function topicBody(r) {
  const comps = new Map(arr(S.meta.exit_competencies).map(c => [obj(c).id, obj(c).statement]));
  const rows = [
    ['Prerequisites', 'prerequisites', refs(r.prerequisites)],
    ['Encompasses', 'encompasses', arr(r.encompasses).map(e => ref(obj(e).id, `weight ${obj(e).weight}`)).join('') || none],
    ['Confusable with', 'confusable_with', refs(r.confusable_with)],
    ['Serves', 'serves', arr(r.serves).map(c => `<div><code>${esc(c)}</code> ${esc(comps.get(c) || '')}</div>`).join('') || none],
    ['Sources', 'sources', arr(r.sources).map(s => `<div class="txt">${fmt(typeof s === 'string' ? s : JSON.stringify(s))}</div>`).join('') || none],
    ['Knowledge points', 'kps', arr(r.kps).map(k => ref(k.id)).join('') || none],
  ];
  const facts = [r.core === false ? 'enrichment' : 'core', r.foundation ? 'foundation' : '', r.est_minutes != null ? `${r.est_minutes} min first lesson` : '', `graph depth ${r.depth}`].filter(Boolean).join(' · ');
  return `<h1 data-f="title">${fmt(r.title)}</h1><p class="sub-line">${esc(facts)}</p>` +
    sec('plain', 'Graph', 'graph', `<dl class="graph">${rows.map(([k, f, v]) => `<dt>${k}</dt><dd data-f="${f}">${v}</dd>`).join('')}</dl>`) +
    sec('items', `Review · ${arr(r.review).length}`, 'review', arr(r.review).map((q, j) => item(q, 'review.' + j, 'Review item')).join('') || none) +
    sec('items', 'Diagnostic', 'diagnostic', r.diagnostic ? item(r.diagnostic, 'diagnostic', 'Diagnostic') : none) +
    context();
}

const isLong = t => t.length > 1200 || t.split('\n').length > 14;
const fold = (t, summary) => (isLong(t) ? `<details><summary>${esc(summary || '(empty)')} <span class="muted">· ${t.split('\n').length} lines</span></summary><code class="block out">${esc(t)}</code></details>` : `<code class="block out">${esc(t) || '(empty)'}</code>`);
function inputParts(inp) {
  return Object.entries(inp).filter(([k]) => !['command', 'description', 'file_path'].includes(k)).map(([k, v]) => {
    const s = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    return s.length < 100 && !s.includes('\n') ? `<div class="kv"><span class="k">${esc(k)}</span><code>${esc(s)}</code></div>`
      : `<details><summary>${esc(k)} · ${s.split('\n').length} lines</summary><code class="block">${esc(s)}</code></details>`;
  }).join('');
}
function msg(it, f) {
  const t = String(it.text ?? '');
  const box = (cls, label, inner) => `<div class="msg ${cls}" data-f="${f}"><div class="lbl">${label}</div>${inner}</div>`;
  if (it.type === 'thinking') return box('think', 'Thinking', `<div class="txt">${fmt(t)}</div>`);
  if (it.type === 'text') return box('asst', 'Assistant', `<div class="txt">${fmt(t)}</div>`);
  if (it.type === 'final') return box('asst final', 'Final answer', `<div class="txt">${fmt(t)}</div>`);
  if (it.type === 'user') return it.boilerplate
    ? `<details class="msg user boiler" data-f="${f}"><summary><span class="lbl">Skill text</span> loaded into the context: ${t.length.toLocaleString()} characters, the same in every run</summary><div class="txt">${fmt(t)}</div></details>`
    : box('user', 'User', `<div class="txt">${fmt(t)}</div>`);
  if (it.type === 'tool_call') {
    const inp = obj(it.input);
    return box('call', 'Tool call', `<div class="call-head"><code class="tool">${esc(it.name)}</code>${inp.description ? `<span class="muted">${esc(inp.description)}</span>` : ''}</div>` +
      (inp.command ? fold(String(inp.command), String(inp.command).split('\n')[0]) : '') + (inp.file_path ? `<div><code>${esc(inp.file_path)}</code></div>` : '') + inputParts(inp));
  }
  if (it.type === 'tool_result') return box('result' + (it.is_error ? ' err' : ''), 'Tool result' + (it.is_error ? ' · error' : ''), fold(t, it.summary));
  return '';
}
function traceBody(r) {
  const m = obj(r.meta), calls = Object.entries(obj(m.tool_calls)).map(([k, v]) => `${k} ${v}`).join(', ');
  const facts = [m.model, m.duration_ms != null ? `${Math.round(m.duration_ms / 60000)} min` : '', m.total_cost_usd != null ? `$${(+m.total_cost_usd).toFixed(2)}` : '',
    m.num_turns != null ? `${m.num_turns} turns` : '', m.is_error ? 'ended in an error' : ''].filter(Boolean).join(' · ');
  return `<h1 data-f="title">${esc(r.title)}</h1><p class="sub-line">${esc(facts)}</p>` + (calls ? `<p class="sub-line">Tool calls: ${esc(calls)}</p>` : '') +
    arr(r.steps).map((s, i) => `<section class="step${s.agent ? ' sub' : ''}" data-f="steps.${i}"><div class="step-head"><code>step ${i + 1}</code>${s.agent ? `<span class="tag">subagent · ${esc(s.agent)}</span>` : ''}</div>${arr(s.items).map((it, j) => msg(obj(it), `steps.${i}.items.${j}`)).join('')}</section>`).join('');
}

function recHead(r) {
  const i = S.sample.indexOf(r.id), bits = [`<code class="rid">${esc(r.id)}</code>`, `<span class="kind">${KIND[r.kind] || esc(r.kind)}</span>`];
  if (r.kind === 'kp') bits.push(`<span class="muted">in</span>${ref(r.topic_id)}`);
  if (r.strand) bits.push(`<span class="muted">strand <b>${esc(r.strand)}</b></span>`);
  if (r.cluster != null) bits.push(`<span class="muted"><i class="sw" style="background:${col(r.cluster)}"></i>cluster ${r.cluster + 1}</span>`);
  const flags = arr(r.flags).map(f => `<span class="flag" title="Structural outlier among the course's ${KIND[r.kind]}s">${esc(f)}</span>`).join('');
  return `<div class="rec-head"><div class="row"><div class="bits">${bits.join('')}</div><div class="pos"><span class="muted">${i >= 0 ? `${i + 1} of ${S.sample.length}` : 'not in the sample'}</span>` +
    `<button class="nav" data-step="-1" aria-label="Previous record (k)" ${i <= 0 ? 'disabled' : ''}>‹</button><button class="nav" data-step="1" aria-label="Next record (j)" ${i < 0 || i >= S.sample.length - 1 ? 'disabled' : ''}>›</button></div></div>` +
    (flags ? `<div class="flags">${flags}</div>` : '') + '</div>';
}

function renderContent(id) {
  const r = S.records.get(id);
  if (!r) { $('#record').innerHTML = '<p class="empty">No records in the sample.</p>'; return; }
  closePopover();
  const changed = S.current !== id;
  S.current = id;
  S.fresh.delete(id);
  const body = r.kind === 'kp' ? kpBody(r) : r.kind === 'topic' ? topicBody(r) : traceBody(r);
  $('#record').innerHTML = recHead(r) + `<div id="body">${body}</div>`;
  renderList();
  refreshMarks();
  if (S.focus) { const [t, fid] = S.focus; S.focus = null; requestAnimationFrame(() => focusMark(t, fid)); }
  else if (changed) scrollTo(0, 0);
}

function renderList() {
  const notes = countBy(S.annotations, 'record_id'), sugg = countBy(pendingSugg(), 'record_id');
  $('#list').innerHTML = `<div class="list-head">Sample · ${S.sample.length} records<br>${S.sample.filter(id => notes[id]).length} with notes</div>` +
    S.sample.map(id => {
      const r = S.records.get(id);
      return `<a class="li${id === S.current ? ' cur' : ''}" href="#content/${encodeURIComponent(id)}"><i class="shape s-${r.kind}"></i><code>${esc(id)}</code><span class="t">${esc(r.title)}</span>` +
        (S.fresh.has(id) ? '<span class="pill new">new</span>' : '') +
        (notes[id] ? `<span class="pill a" title="${notes[id]} notes">${notes[id]}</span>` : '') +
        (sugg[id] ? `<span class="pill s" title="${sugg[id]} agent suggestions">${sugg[id]}</span>` : '') + '</a>';
    }).join('');
  $('#list .cur')?.scrollIntoView({block: 'nearest'});
  const n = pendingSugg().length;
  $('#pending').textContent = n || '';
}

// ---------- anchoring: text offsets in #body, with a quote search inside the named field as the fallback ----------
function textOffset(root, node, off) { const r = document.createRange(); r.setStart(root, 0); r.setEnd(node, off); return r.toString().length; }
function normMap(raw) { // collapse whitespace and drop the marks fmt() removes; map[i] = index in raw of out[i]
  let out = '', space = true;
  const map = [];
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c === '`' || c === '*') continue;
    if (/\s/.test(c)) { if (!space) { out += ' '; map.push(i); space = true; } continue; }
    out += c; map.push(i); space = false;
  }
  return {out, map};
}
const norm = s => normMap(String(s ?? '')).out.trim();
function findIn(body, el, q) {
  const {out, map} = normMap(el.textContent), nq = norm(q), i = nq ? out.indexOf(nq) : -1;
  if (i < 0) return null;
  const base = el === body ? 0 : textOffset(body, el, 0);
  return [base + map[i], base + map[i + nq.length - 1] + 1];
}
function scopeEl(body, field) {
  const segs = String(field || '').split('.').filter(Boolean);
  for (; segs.length; segs.pop()) { const el = body.querySelector(`[data-f="${CSS.escape(segs.join('.'))}"]`); if (el) return el; }
  return body;
}
function anchor(body, x) {
  const q = x.quote ?? x.text ?? '';
  if (Number.isInteger(x.start) && x.end > x.start && norm(S.bodyText.slice(x.start, x.end)) === norm(q)) return [x.start, x.end];
  const el = scopeEl(body, x.field);
  if (norm(q)) return findIn(body, el, q) || (el !== body && findIn(body, body, q)) || null;
  const lbl = (el !== body && $('.lbl', el)) || $('h1', body); // nothing quoted: the field's label, else the title
  if (!lbl) return null;
  const s = textOffset(body, lbl, 0);
  return [s, s + lbl.textContent.length];
}
function wrap(root, start, end, make) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits = [];
  let pos = 0, n;
  while ((n = tw.nextNode()) && pos < end) {
    const len = n.nodeValue.length;
    if (len && pos + len > start) hits.push([n, Math.max(0, start - pos), Math.min(len, end - pos)]);
    pos += len;
  }
  return hits.map(([node, a, b]) => {
    if (b < node.nodeValue.length) node.splitText(b);
    if (a > 0) node = node.splitText(a);
    const m = make();
    node.before(m);
    m.append(node);
    return m;
  });
}
const mk = (cls, t, id) => () => { const m = document.createElement('mark'); m.className = cls; if (t) m.dataset[t] = id; return m; };
function unmark(root, sel = 'mark') { root.querySelectorAll(sel).forEach(m => m.replaceWith(...m.childNodes)); root.normalize(); }

function refreshMarks() {
  const body = $('#body');
  if (!body) return;
  if (!$('#popover').hidden) { S.marksStale = true; return; } // never pull the pending highlight from under the reviewer
  unmark(body);
  S.bodyText = body.textContent;
  const items = [...pendingSugg().filter(s => s.record_id === S.current).map(x => ({t: 's', x})),
    ...S.annotations.filter(a => a.record_id === S.current).map(x => ({t: 'a', x}))];
  for (const it of items) {
    it.at = anchor(body, it.x);
    if (it.at) wrap(body, it.at[0], it.at[1], mk(it.t === 'a' ? 'hl' : 'sg', it.t, it.x.id));
  }
  const lost = '<div class="lost">quoted text not found in this record</div>';
  $('#margin').innerHTML = items.map(({t, x, at}) => t === 'a'
    ? `<div class="note ann" data-type="a" data-id="${esc(x.id)}" tabindex="0">${x.from_suggestion ? '<span class="tag">accepted suggestion</span>' : ''}<div class="q">${esc(short(x.quote, 110))}</div><div class="txt">${esc(x.note)}</div>${at ? '' : lost}<div class="acts"><button data-act="edit">Edit</button><button data-act="del">Delete</button></div></div>`
    : `<div class="note sug" data-type="s" data-id="${esc(x.id)}" tabindex="0"><span class="tag">agent suggestion · ${esc(x.source || 'agent')}</span><div class="mode">${esc(x.mode || '')}</div>${norm(x.quote ?? x.text) ? `<div class="q">${esc(short(x.quote ?? x.text, 110))}</div>` : ''}<div class="txt">${esc(x.note || '')}</div>${at ? '' : lost}<div class="acts on"><button data-act="accept" class="primary">Accept</button><button data-act="dismiss">Dismiss</button></div></div>`).join('');
  layoutMargin();
}
function anchorTop(note, body) {
  const marks = body.querySelectorAll(`mark[data-${note.dataset.type}="${CSS.escape(note.dataset.id)}"]`);
  for (const m of marks) { const r = m.getBoundingClientRect(); if (r.height) return r.top; }
  let d = marks[0]?.closest('details:not([open])'), outer = d; // inside a closed fold: align with its summary
  while (d) { outer = d; d = d.parentElement.closest('details:not([open])'); }
  return (outer ? $('summary', outer) : body).getBoundingClientRect().top;
}
function layoutMargin() {
  const m = $('#margin'), body = $('#body');
  if (!body || $('#view-content').hidden) return;
  const top0 = m.getBoundingClientRect().top;
  let y = 0;
  const notes = [...m.children].map(n => ({n, top: anchorTop(n, body) - top0})).sort((a, b) => a.top - b.top);
  for (const {n, top} of notes) { const t = Math.max(top, y); n.style.top = t + 'px'; y = t + n.offsetHeight + 10; }
  m.style.minHeight = y + 'px';
}
function focusMark(t, id) {
  const sel = `#body mark[data-${t}="${CSS.escape(id)}"]`, m = $(sel);
  if (!m) return;
  for (let d = m.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
  m.scrollIntoView({block: 'center'});
  document.querySelectorAll(sel).forEach(x => { x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash'); });
  layoutMargin();
}
function setLinked(k) {
  if (k === S.linked) return;
  S.linked = k;
  document.querySelectorAll('.linked').forEach(x => x.classList.remove('linked'));
  if (!k) return;
  const [t, id] = [k[0], CSS.escape(k.slice(2))];
  document.querySelectorAll(`#body mark[data-${t}="${id}"], #margin .note[data-type="${t}"][data-id="${id}"]`).forEach(x => x.classList.add('linked'));
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest?.('#body mark[data-a], #body mark[data-s], #margin .note');
  setLinked(!el ? null : el.matches('.note') ? `${el.dataset.type}:${el.dataset.id}` : el.dataset.a ? `a:${el.dataset.a}` : `s:${el.dataset.s}`);
});

// ---------- annotating ----------
document.addEventListener('mouseup', () => setTimeout(() => {
  const pop = $('#popover'), body = $('#body'), sel = getSelection();
  if (!pop.hidden || !body || $('#view-content').hidden || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0), raw = r.toString();
  if (!body.contains(r.startContainer) || !body.contains(r.endContainer) || !raw.trim()) return;
  const start = textOffset(body, r.startContainer, r.startOffset) + raw.length - raw.trimStart().length;
  const end = textOffset(body, r.endContainer, r.endOffset) - (raw.length - raw.trimEnd().length);
  const anc = r.commonAncestorContainer, el = (anc.nodeType === 1 ? anc : anc.parentElement).closest('[data-f]');
  S.pending = {start, end, quote: raw.trim(), field: el && body.contains(el) ? el.dataset.f : ''};
  sel.removeAllRanges();
  const marks = wrap(body, start, end, mk('pending')); // keep the span visible while the input has focus
  const rect = marks[marks.length - 1].getBoundingClientRect();
  pop.hidden = false;
  pop.style.top = rect.bottom + scrollY + 8 + 'px';
  pop.style.left = Math.max(12, Math.min(rect.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 12)) + 'px';
  const ta = $('textarea', pop);
  ta.value = '';
  ta.focus({preventScroll: true});
}));
function closePopover() {
  $('#popover').hidden = true;
  S.pending = null;
  const body = $('#body');
  if (body) unmark(body, 'mark.pending');
  if (S.marksStale) { S.marksStale = false; refreshMarks(); }
}
function savePending() {
  const p = S.pending, note = $('#popover textarea').value.trim();
  closePopover();
  if (!p || !note) return;
  const now = new Date().toISOString();
  S.annotations.push({id: uid(), record_id: S.current, field: p.field, quote: p.quote, start: p.start, end: p.end, note, created: now, updated: now});
  persist();
  refreshMarks();
  renderList();
}
$('#popover textarea').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); savePending(); }
  else if (e.key === 'Escape') { e.preventDefault(); closePopover(); }
});
$('#pop-save').onclick = savePending;
document.addEventListener('mousedown', e => { if (!$('#popover').hidden && !$('#popover').contains(e.target)) closePopover(); });

$('#margin').addEventListener('click', e => {
  const note = e.target.closest('.note');
  if (!note || e.target.closest('textarea')) return;
  const id = note.dataset.id, act = e.target.closest('button')?.dataset.act;
  if (act === 'edit') return editNote(note, id);
  if (act === 'del') {
    if (confirm('Delete this note?')) { S.annotations = S.annotations.filter(a => a.id !== id); persist(); refreshMarks(); renderList(); }
    return;
  }
  if (act) return decide([id], act === 'accept' ? 'accepted' : 'dismissed');
  focusMark(note.dataset.type, id);
});
function editNote(note, id) {
  const a = S.annotations.find(x => x.id === id);
  if (!a) return;
  const box = $('.txt', note);
  box.innerHTML = '<textarea rows="3" aria-label="Edit note"></textarea>';
  const ta = $('textarea', box);
  ta.value = a.note;
  ta.focus();
  layoutMargin();
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    if (save && ta.value.trim() && ta.value.trim() !== a.note) { a.note = ta.value.trim(); a.updated = new Date().toISOString(); persist(); }
    refreshMarks();
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') finish(false);
  });
  ta.addEventListener('blur', () => finish(true));
}

async function decide(ids, status) {
  const now = new Date().toISOString();
  for (const id of ids) {
    const s = S.suggestions.find(x => x.id === id);
    if (!s || s.status === status) continue;
    s.status = status;
    S.decided.set(id, status);
    if (status === 'accepted') S.annotations.push({id: uid(), record_id: s.record_id, field: s.field || '', quote: s.quote ?? s.text ?? '',
      note: s.note || s.mode || 'accepted suggestion', mode: s.mode, from_suggestion: s.id, created: now, updated: now});
  }
  if (status === 'accepted') persist();
  refreshViews();
  try { await post('suggestions', ids.map(id => ({id, status, decided: now}))); }
  catch { saveStatus('Decision not saved: server unreachable', true); }
}

// ---------- saving, backup, polling ----------
const backupKey = () => 'review-annotations:' + (S.meta.dataset || location.host);
async function post(name, data) {
  const r = await fetch('/api/' + name, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
}
function saveStatus(text, err) { const el = $('#save'); el.textContent = text; el.classList.toggle('err', !!err); }
function persist() {
  try { localStorage.setItem(backupKey(), JSON.stringify(S.annotations)); } catch {}
  S.dirty = true;
  saveStatus('Saving…');
  S.saving = S.saving.then(async () => { // one save at a time, always the latest list
    if (!S.dirty) return;
    S.dirty = false;
    try { await post('annotations', S.annotations); saveStatus('Saved ' + new Date().toLocaleTimeString()); }
    catch { S.dirty = true; saveStatus('Not saved: server unreachable. Kept in this browser, retrying.', true); }
  });
}
function restoreBackup() {
  let backup = [];
  try { backup = arr(JSON.parse(localStorage.getItem(backupKey()) || '[]')); } catch {}
  const byId = new Map(S.annotations.map(a => [a.id, a]));
  let restored = 0;
  for (const a of backup) {
    const s = byId.get(a.id);
    if (!s || String(a.updated) > String(s.updated)) { byId.set(a.id, a); restored++; }
  }
  if (!restored) return;
  S.annotations = [...byId.values()];
  persist();
  banner(`Restored ${restored} note${restored > 1 ? 's' : ''} from this browser's backup that the server did not have.`);
}
function setSamples(d) {
  const before = new Set(S.sample);
  S.meta = obj(d.meta);
  S.records = new Map(arr(d.records).map(r => [r.id, r]));
  S.sample = arr(d.sample).filter(id => S.records.has(id));
  $('#course-title').textContent = S.meta.title || '';
  return before.size ? S.sample.filter(id => !before.has(id)) : [];
}
function setSuggestions(list) {
  S.suggestions = arr(list).map(s => {
    const mine = S.decided.get(s.id); // a decision posted a moment ago wins over a stale read
    if (mine && (s.status || 'pending') === 'pending') return {...s, status: mine};
    S.decided.delete(s.id);
    return s;
  });
  const fresh = pendingSugg().filter(s => !S.seen.has(s.id)).length;
  S.suggestions.forEach(s => S.seen.add(s.id));
  return fresh;
}
function banner(text, actions = '') {
  const b = $('#banner');
  b.innerHTML = `<span>${text}</span>${actions}<button data-b="close" aria-label="Close">×</button>`;
  b.hidden = false;
}
function newsBanner() {
  const parts = [], acts = [];
  if (S.news.samples.length) { parts.push(`${S.news.samples.length} new sample${S.news.samples.length > 1 ? 's' : ''}: ${S.news.samples.map(esc).join(', ')}`); acts.push('<button data-b="samples">Show</button>'); }
  if (S.news.sugg) { parts.push(`${S.news.sugg} new agent suggestion${S.news.sugg > 1 ? 's' : ''}`); acts.push('<button data-b="sugg">Review</button>'); }
  if (parts.length) banner(parts.join(' · '), acts.join(''));
}
$('#banner').addEventListener('click', e => {
  const b = e.target.closest('button')?.dataset.b;
  if (!b) return;
  if (b === 'samples' && S.news.samples.length) go(S.news.samples[0]);
  if (b === 'sugg') location.hash = '#progress';
  S.news = {samples: [], sugg: 0};
  $('#banner').hidden = true;
});
async function getJSON(name) {
  const r = await fetch('/api/' + name, {cache: 'no-cache'});
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
  const tag = r.headers.get('ETag');
  if (tag && tag === S.etag[name]) return null; // unchanged since the last read
  S.etag[name] = tag;
  return r.json();
}
async function poll() {
  let changed = false;
  for (const name of ['samples', 'suggestions', 'patterns', 'graph']) {
    let d;
    try { d = await getJSON(name); } catch { continue; }
    if (!d) continue;
    changed = true;
    if (name === 'samples') S.news.samples.push(...setSamples(d));
    if (name === 'suggestions') S.news.sugg += setSuggestions(d);
    if (name === 'patterns') S.patterns = obj(d);
    if (name === 'graph') S.graph = obj(d);
  }
  if (changed) { newsBanner(); refreshViews(); }
  if (S.dirty) persist();
}
function refreshViews() {
  renderList();
  if (!$('#view-content').hidden) refreshMarks();
  if (!$('#view-map').hidden) renderMap();
  if (!$('#view-progress').hidden) renderProgress();
}

// ---------- map ----------
function hull(ps) {
  const p = [...ps].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = pts => pts.reduce((h, q) => { while (h.length > 1 && cross(h[h.length - 2], h[h.length - 1], q) <= 0) h.pop(); h.push(q); return h; }, []);
  const lo = half(p), up = half(p.reverse());
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function renderMap() {
  const plot = $('#map-plot'), W = Math.max(600, plot.clientWidth), H = 580, pad = 40;
  const pts = arr(S.graph.points), P = pts.filter(p => p.x != null), notes = countBy(S.annotations, 'record_id'), inSample = new Set(S.sample);
  const clusters = arr(S.graph.clusters);
  $('#map-sub').textContent = `${pts.length} records · ${S.sample.length} in the sample · ${Object.keys(notes).length} with notes · ${clusters.length} clusters. Each kind is clustered (k-means) and projected (PCA) on its own structural features.`;
  if (!P.length) { plot.innerHTML = '<p class="empty">No records to draw.</p>'; $('#map-legend').innerHTML = ''; return; }
  // one panel per kind: prepare.py clusters and projects knowledge points and topics separately, each scaled to 0-1
  const kinds = ['kp', 'topic'].filter(k => P.some(p => p.kind === k)), gap = 28, top = 30, pw = (W - gap * (kinds.length - 1)) / kinds.length;
  const sx = p => kinds.indexOf(p.kind) * (pw + gap) + pad + p.x * (pw - 2 * pad), sy = p => top + pad + (1 - p.y) * (H - top - 2 * pad);
  const panels = kinds.map((k, i) => `<rect class="panel" x="${i * (pw + gap)}" y="0" width="${pw}" height="${H}" rx="10"/><text class="ptitle" x="${i * (pw + gap) + 14}" y="22">${k === 'kp' ? 'Knowledge points' : 'Topics'} · ${P.filter(p => p.kind === k).length}</text>`).join('');
  const groups = {};
  P.forEach(p => (groups[p.cluster] ??= []).push([sx(p), sy(p)]));
  const hulls = Object.entries(groups).map(([c, g]) => `<path d="M${hull(g).map(q => q.map(v => v.toFixed(1)).join(' ')).join('L')}Z" fill="${col(c)}" stroke="${col(c)}"/>`).join('');
  const dot = p => {
    const x = sx(p), y = sy(p), s = inSample.has(p.id), r = s ? 7 : 4.5;
    const a = `class="pt${s ? ' smp' : ''}" data-id="${esc(p.id)}" fill="${notes[p.id] ? 'var(--annotated)' : col(p.cluster)}"`;
    return p.kind === 'topic' ? `<rect ${a} x="${(x - r).toFixed(1)}" y="${(y - r).toFixed(1)}" width="${2 * r}" height="${2 * r}" rx="1.5"/>` : `<circle ${a} cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;
  };
  plot.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter plot of all records, coloured by cluster">${panels}<g class="hulls">${hulls}</g>${P.filter(p => !inSample.has(p.id)).map(dot).join('')}${P.filter(p => inSample.has(p.id)).map(dot).join('')}</svg>`;
  const off = pts.filter(p => p.x == null);
  $('#map-legend').innerHTML = `<div class="legend"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="var(--muted)"/></svg>knowledge point</span><span><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="var(--muted)"/></svg>topic</span>` +
    `<span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>in the sample, click to open</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="var(--annotated)"/></svg>has notes</span>` +
    (off.length ? `<span>not on the map: ${off.map(p => ref(p.id)).join('')}</span>` : '') + '</div>' +
    `<ul class="clusters">${clusters.map(c => `<li><i class="sw" style="background:${col(c.id)}"></i><b>cluster ${c.id + 1}</b> · ${c.size} · ${esc(c.label)}</li>`).join('')}</ul>`;
}
$('#map-plot').addEventListener('mousemove', e => {
  const t = e.target.closest('.pt'), tip = $('#tip');
  if (!t) { tip.hidden = true; return; }
  const r = S.records.get(t.dataset.id) || {}, c = arr(S.graph.clusters)[r.cluster], n = countBy(S.annotations, 'record_id')[r.id] || 0;
  tip.innerHTML = `<b>${esc(r.title)}</b><br><code>${esc(r.id)}</code> · ${KIND[r.kind]}${r.strand ? ' · strand ' + esc(r.strand) : ''}<br>cluster ${r.cluster + 1}: ${esc(c?.label || '')}<br>${n} note${n === 1 ? '' : 's'} · ${S.sample.includes(r.id) ? 'in the sample' : 'not in the sample'}`;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + 'px';
  tip.style.top = e.clientY + 14 + 'px';
  tip.hidden = false;
});
$('#map-plot').addEventListener('mouseleave', () => { $('#tip').hidden = true; });
$('#map-plot').addEventListener('click', e => { const t = e.target.closest('.pt.smp'); if (t) { $('#tip').hidden = true; go(t.dataset.id); } });

// ---------- progress ----------
function squarify(values, x, y, w, h) { // squarified treemap; returns one rect per value, same order
  const total = values.reduce((a, b) => a + b, 0), out = [];
  let rest = values.map((v, i) => ({i, a: v / total * w * h}));
  while (rest.length) {
    const side = Math.min(w, h);
    let row = [], best = Infinity;
    while (rest.length) {
      const next = [...row, rest[0]], s = next.reduce((a, b) => a + b.a, 0);
      const worst = Math.max(...next.map(r => Math.max(side * side * r.a / (s * s), s * s / (side * side * r.a))));
      if (worst > best) break;
      best = worst; row = next; rest = rest.slice(1);
    }
    const s = row.reduce((a, b) => a + b.a, 0), thick = s / side;
    let off = 0;
    for (const r of row) {
      const len = r.a / thick;
      out[r.i] = w >= h ? {x, y: y + off, w: thick, h: len} : {x: x + off, y, w: len, h: thick};
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
  }
  return out;
}
function renderProgress() {
  const anns = S.annotations, byId = new Map(anns.map(a => [a.id, a]));
  const modes = Object.entries(obj(S.patterns)).map(([name, p]) => ({name, p: obj(p), n: Math.max(1, +obj(p).count || arr(obj(p).example_ids).length)})).sort((a, b) => b.n - a.n);
  const grouped = new Set(modes.flatMap(m => arr(m.p.example_ids)));
  const loose = anns.filter(a => !grouped.has(a.id)).length;
  $('#modes-sub').textContent = `${modes.length} failure modes · ${anns.length} notes on ${new Set(anns.map(a => a.record_id)).size} records` + (loose ? ` · ${loose} notes not grouped yet` : '');
  const tm = $('#treemap');
  if (!modes.length) {
    tm.style.height = 'auto';
    tm.innerHTML = `<p class="empty">No failure modes yet. The agent groups your notes into modes here as you write them.</p>`;
  } else {
    tm.style.height = '';
    const W = tm.clientWidth, H = tm.clientHeight, rects = squarify(modes.map(m => m.n), 0, 0, W, H);
    tm.innerHTML = modes.map((m, i) => {
      const r = rects[i], ids = arr(m.p.example_ids);
      const items = ids.map(id => byId.get(id) ? `<li><a href="#" data-note="${esc(id)}">${esc(short(byId.get(id).note, 140))}</a> <code>${esc(byId.get(id).record_id)}</code></li>`
        : S.records.has(id) ? `<li>${ref(id)}</li>` : '').join('') || arr(m.p.example_quotes).map(q => `<li class="muted">${esc(short(q, 140))}</li>`).join('');
      return `<div class="tm" style="left:${r.x + 3}px;top:${r.y + 3}px;width:${Math.max(0, r.w - 6)}px;height:${Math.max(0, r.h - 6)}px;--c:${CLUSTER[i % CLUSTER.length]}"><h3>${esc(m.name)} <span>${m.n}</span></h3>${m.p.description ? `<p>${esc(m.p.description)}</p>` : ''}<ul>${items}</ul></div>`;
    }).join('');
  }
  const pend = pendingSugg().sort((a, b) => String(a.mode).localeCompare(String(b.mode)) || String(a.record_id).localeCompare(String(b.record_id)));
  const st = countBy(S.suggestions, 'status');
  $('#queue-sub').textContent = `${pend.length} waiting · ${st.accepted || 0} accepted · ${st.dismissed || 0} dismissed`;
  $('#pick-all').checked = false;
  $('#queue').innerHTML = pend.map(s => `<div class="srow"><input type="checkbox" class="pick" value="${esc(s.id)}" aria-label="Select this suggestion"><div><span class="mode">${esc(s.mode || '')}</span><span class="src">${esc(s.source || 'agent')}</span>` +
    `<a href="#" class="q" data-sid="${esc(s.id)}">${esc(short(s.quote ?? s.text, 200)) || '(the whole record)'}</a><div class="note-t">${esc(s.note || '')}</div></div><div>${ref(s.record_id)}</div></div>`).join('') || '<p class="empty">No suggestions waiting.</p>';
}
$('#treemap').addEventListener('click', e => {
  const a = e.target.closest('[data-note]');
  if (!a) return;
  e.preventDefault();
  const n = S.annotations.find(x => x.id === a.dataset.note);
  if (n) go(n.record_id, ['a', n.id]);
});
$('#queue').addEventListener('click', e => {
  const a = e.target.closest('[data-sid]');
  if (!a) return;
  e.preventDefault();
  const s = S.suggestions.find(x => x.id === a.dataset.sid);
  if (s) go(s.record_id, ['s', s.id]);
});
$('#pick-all').onchange = e => document.querySelectorAll('#queue .pick').forEach(c => { c.checked = e.target.checked; });
const picked = () => [...document.querySelectorAll('#queue .pick:checked')].map(c => c.value);
$('#accept-sel').onclick = () => picked().length && decide(picked(), 'accepted');
$('#dismiss-sel').onclick = () => picked().length && decide(picked(), 'dismissed');

// ---------- navigation ----------
function go(id, focus) {
  S.focus = focus || null;
  const h = '#content/' + encodeURIComponent(id);
  if (location.hash === h) route(); else location.hash = h;
}
function route() {
  const [view, ...rest] = decodeURIComponent(location.hash.slice(1)).split('/'), id = rest.join('/');
  const v = ['map', 'progress'].includes(view) ? view : 'content';
  document.querySelectorAll('.view').forEach(x => { x.hidden = x.id !== 'view-' + v; });
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.view === v));
  $('#tip').hidden = true;
  renderList(); // also sets the pending count on the Progress tab
  if (v === 'content') renderContent(S.records.has(id) ? id : S.records.has(S.current) ? S.current : S.sample[0]);
  if (v === 'map') renderMap();
  if (v === 'progress') renderProgress();
}
addEventListener('hashchange', route);
$('#record').addEventListener('click', e => {
  const b = e.target.closest('button.nav');
  if (b) go(S.sample[S.sample.indexOf(S.current) + +b.dataset.step]);
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea') || $('#view-content').hidden) return;
  const i = S.sample.indexOf(S.current), next = e.key === 'j' ? i + 1 : e.key === 'k' ? i - 1 : -1;
  if (next >= 0 && next < S.sample.length && i >= 0) go(S.sample[next]);
});
addEventListener('resize', () => { layoutMargin(); if (!$('#view-map').hidden) renderMap(); if (!$('#view-progress').hidden) renderProgress(); });
document.addEventListener('toggle', layoutMargin, true); // opening a fold moves every note below it

(async () => {
  try {
    const [samples, annotations, suggestions, patterns, graph] = await Promise.all(['samples', 'annotations', 'suggestions', 'patterns', 'graph'].map(getJSON));
    setSamples(samples);
    S.annotations = arr(annotations);
    setSuggestions(suggestions);
    S.patterns = obj(patterns);
    S.graph = obj(graph);
  } catch (e) {
    document.body.innerHTML = `<div class="fatal"><h2>The review server is not answering</h2><p>Start it with <code>python3 evals/review/server.py --data &lt;dir&gt;/error_discovery_data</code> and reload. (${esc(e.message)})</p></div>`;
    return;
  }
  restoreBackup();
  route();
  document.fonts?.ready.then(layoutMargin);
  setInterval(poll, 4000);
})();
</script>
</body>
